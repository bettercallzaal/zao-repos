name: Sync repo data

on:
  schedule:
    - cron: '17 * * * *'   # hourly, off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/sync.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch repo data
        env:
          GITHUB_TOKEN: ${{ secrets.ZAO_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/fetch.mjs

      - name: Commit data.json
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh repo data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
